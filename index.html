<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>简读</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== Bookshelf ===== -->
<div id="bookshelf">
  <header class="bs-header">
    <div class="bs-header-left">
      <div class="import-dropdown">
        <button class="bs-import-btn" id="bs-import" title="导入书籍">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <div class="import-dropdown-menu" id="import-dropdown-menu">
          <button class="import-dropdown-item" id="import-local">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
            <span>本地上传</span>
          </button>
          <button class="import-dropdown-item" id="import-webdav">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span>远程上传</span>
          </button>
        </div>
      </div>
      <button type="button" class="bs-title" id="bs-title" title="连续点击五次切换隐藏书架" aria-label="简读，连续点击五次切换隐藏书架">简读<span class="bs-subtitle"> · 书架</span></button>
    </div>
    <div class="bs-header-center">
      <div class="bs-library-tools" id="bs-library-tools">
        <label class="bs-search" for="bs-search-input">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/></svg>
          <input type="search" id="bs-search-input" placeholder="搜索书架" autocomplete="off">
        </label>
        <select id="bs-cat" aria-label="书架分类筛选">
          <option value="__all__">全部分类</option>
        </select>
        <select id="bs-sort" aria-label="书架排序">
          <option value="recent">最近阅读</option>
          <option value="title">书名排序</option>
          <option value="progress">阅读进度</option>
        </select>
      </div>
    </div>
    <div class="bs-header-right">
      <button class="bs-icon-btn" id="bs-theme-btn" title="切换主题">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button class="bs-icon-btn" id="bs-settings-btn" title="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>
  <main class="bs-main" id="bs-main">
    <div class="bs-grid" id="bs-grid"></div>
    <div class="bs-empty" id="bs-empty">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".25"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="9" y1="7" x2="16" y2="7"/><line x1="9" y1="11" x2="14" y2="11"/></svg>
      <p>书架空空如也</p>
      <p class="bs-empty-hint">点击左上角导入或拖拽文件到此处</p>
    </div>
  </main>
</div>

<!-- ===== Loading ===== -->
<div id="loading"><div class="spinner"></div><p id="loading-text">正在解析文件...</p></div>

<!-- ===== Reader ===== -->
<div id="reader">
  <header id="toolbar">
    <button class="tb-btn" id="btn-toc" title="目录"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <div class="tb-title" id="tb-title">—</div>
    <button class="tb-btn" id="btn-home" title="返回书架"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></button>
    <button class="tb-btn" id="btn-search" title="搜索"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
    <button class="tb-btn" id="btn-bm" title="书签"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
    <button class="tb-btn" id="btn-theme" title="主题"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
    <button class="tb-btn" id="btn-pomo" title="番茄钟"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg></button>
    <button class="tb-btn" id="btn-settings" title="设置"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>

  <div id="search-bar"><div class="search-row">
    <input type="text" id="search-input" placeholder="搜索全文内容...">
    <span id="search-count"></span>
    <button class="sr-btn" id="s-prev" title="上一个"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg></button>
    <button class="sr-btn" id="s-next" title="下一个"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
    <button class="sr-btn" id="s-close" title="关闭"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div></div>

  <div id="sidebar-overlay"></div>
  <aside id="sidebar">
    <div class="sidebar-head"><b id="sidebar-title">—</b><span id="sidebar-info">—</span></div>
    <div class="sidebar-tabs"><button class="stab active" data-tab="toc">目录</button><button class="stab" data-tab="bm">书签</button><button class="stab" data-tab="ant">笔记</button></div>
    <div id="toc-panel" class="stab-panel active"><div id="toc-list"></div></div>
    <div id="bm-panel" class="stab-panel"><div id="bm-list"></div></div>
    <div id="ant-panel" class="stab-panel"><div id="ant-list"></div></div>
  </aside>

  <main id="content"><div id="sticky-head"></div><div id="content-inner"></div></main>
  <div id="progress-track"><div id="progress-bar"><div id="progress-fill"></div><div id="progress-thumb"></div></div><div id="progress-tip">0%</div></div>
</div>

<div id="settings-overlay"></div>
<aside id="settings">
  <div class="settings-title">设置</div>
  <div class="settings-group" data-scope="reader"><div class="settings-label">字号 <span id="val-fs">18px</span></div><input type="range" id="range-fs" min="14" max="28" value="18" step="1"></div>
  <div class="settings-group" data-scope="reader"><div class="settings-label">行高 <span id="val-lh">1.85</span></div><input type="range" id="range-lh" min="1.4" max="2.6" value="1.85" step="0.05"></div>
  <div class="settings-group" data-scope="reader"><div class="settings-label">边距</div><div class="settings-row"><button data-pad="narrow">窄</button><button data-pad="normal" class="active">标准</button><button data-pad="wide">宽</button></div></div>
  <div class="settings-group" data-scope="reader"><div class="settings-label">正文字色</div><div class="settings-row color-row">
    <button type="button" class="color-swatch active" data-color="" title="默认" style="background:var(--text)"></button>
    <button type="button" class="color-swatch" data-color="#3a3028" title="深褐" style="background:#3a3028"></button>
    <button type="button" class="color-swatch" data-color="#1a1a1a" title="纯黑" style="background:#1a1a1a"></button>
    <button type="button" class="color-swatch" data-color="#2c3e50" title="墨蓝" style="background:#2c3e50"></button>
    <button type="button" class="color-swatch" data-color="#3d4f3d" title="墨绿" style="background:#3d4f3d"></button>
    <button type="button" class="color-swatch" data-color="#5c4a3a" title="咖啡" style="background:#5c4a3a"></button>
    <button type="button" class="color-swatch" data-color="#dcd6cc" title="浅灰" style="background:#dcd6cc"></button>
  </div></div>
  <div class="settings-group" data-scope="reader"><div class="settings-label">繁转简<label class="switch" title="将繁体内容转为简体显示"><input type="checkbox" id="switch-conv"><span class="slider"></span></label></div></div>
  <div class="settings-group stats-group" data-scope="shelf">
    <div class="settings-label">阅读统计</div>
    <div class="stats-row"><span>本月</span><span id="stats-month">0 分钟</span></div>
    <div class="stats-row"><span>总阅读</span><span id="stats-total">0 分钟</span></div>
    <div class="stats-row"><span>今日</span><span id="stats-today">0 分钟</span></div>
    <div class="stats-row"><span>本书</span><span id="stats-book">0 分钟</span></div>
  </div>
  <div class="settings-group cache-group" data-scope="shelf">
    <div class="settings-label">缓存管理</div>
    <div class="cache-info" id="cache-info"></div>
    <button class="cache-clear-btn" id="cache-clear">清除缓存</button>
  </div>
  <details class="settings-group fold" data-scope="reader">
    <summary class="settings-label">文本替换<label class="switch" title="开启/关闭所有替换规则" style="position:relative"><input type="checkbox" id="switch-rep"><span class="slider"></span></label></summary>
    <div class="fold-body">
      <div class="settings-hint">渲染时全局替换，可用于替换人名、去广告文本</div>
      <div id="rep-list" class="rep-list"></div>
      <div class="rep-add">
        <input type="text" id="rep-f" placeholder="查找" maxlength="60" autocomplete="off">
        <span class="rep-arrow">→</span>
        <input type="text" id="rep-t" placeholder="替换为" maxlength="60" autocomplete="off">
        <button type="button" id="rep-add-btn">添加</button>
      </div>
    </div>
  </details>
  <details class="settings-group fold" data-scope="reader">
    <summary class="settings-label">高亮词<span class="settings-hint">正文着色</span></summary>
    <div class="fold-body">
      <div class="settings-hint">匹配到的词语会在正文中着色显示，可突出角色名、关键词语</div>
      <div id="hl-list" class="hl-list"></div>
      <div class="hl-add">
        <input type="text" id="hl-input" placeholder="输入要高亮的词" maxlength="30" autocomplete="off">
        <div class="hl-colors" id="hl-colors"></div>
        <button type="button" id="hl-add-btn">添加</button>
      </div>
    </div>
  </details>
  <div class="settings-group" data-scope="reader">
    <div class="settings-label">番茄钟时长<span id="val-pomo">25 分钟</span></div>
    <input type="range" id="range-pomo" min="10" max="60" step="5" value="25">
  </div>
  <div class="settings-group" data-scope="reader">
    <div class="settings-label">常驻章节标题<label class="switch" title="阅读区顶部常驻显示当前章节标题"><input type="checkbox" id="switch-sticky"><span class="slider"></span></label></div>
  </div>
  <div class="settings-group cat-group" data-scope="shelf">
    <div class="settings-label">书架分类</div>
    <div class="cat-add"><input type="text" id="cat-input" placeholder="新分类名" maxlength="12" autocomplete="off"><button type="button" id="cat-add-btn">添加</button></div>
    <div id="cat-list" class="cat-list"></div>
  </div>
</aside>

<div id="toast"></div>

<!-- 选区浮动工具条：划线 -->
<div id="sel-toolbar" aria-hidden="true">
  <div class="st-colors" id="st-colors"></div>
  <button type="button" class="st-close" id="st-close" title="取消"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
</div>

<!-- 划线操作弹窗 -->
<div id="ant-pop" aria-hidden="true">
  <div class="ant-pop-head"><b>划线</b><button type="button" class="ant-pop-close" id="ant-pop-close" aria-label="关闭"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <textarea id="ant-note" placeholder="添加备注（可选）" rows="3"></textarea>
  <div class="ant-pop-btns">
    <button type="button" class="ant-pop-save" id="ant-pop-save">保存</button>
    <button type="button" class="ant-pop-del" id="ant-pop-del">删除划线</button>
  </div>
</div>

<!-- 书架分类选择浮层 -->
<div id="cat-pop" aria-hidden="true">
  <div class="cat-pop-head">设置分类</div>
  <div id="cat-pop-list"></div>
</div>

<!-- 确认弹框（渐入渐出） -->
<div class="confirm-overlay" id="confirm-overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="confirm-box">
    <div class="confirm-msg" id="confirm-msg"></div>
    <div class="confirm-btns">
      <button type="button" class="confirm-btn cancel" id="confirm-cancel">取消</button>
      <button type="button" class="confirm-btn ok" id="confirm-ok">确定</button>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept=".txt,.md,.markdown,.epub" hidden>

<!-- WebDAV 模态框 -->
<div class="webdav-modal" id="webdav-modal" role="dialog" aria-modal="true" aria-labelledby="webdav-modal-title" aria-hidden="true">
  <div class="webdav-modal-content" tabindex="-1">
    <div class="webdav-modal-header">
      <h3 id="webdav-modal-title">远程上传</h3>
      <button type="button" class="webdav-modal-close" id="webdav-modal-close" aria-label="关闭远程上传">&times;</button>
    </div>
    
    <!-- 地址输入步骤 -->
    <div class="webdav-step" id="webdav-step-url">
      <div class="webdav-form-group">
        <label for="webdav-url">服务器地址</label>
        <input type="url" id="webdav-url" placeholder="https://example.com/dav/" autocomplete="url">
      </div>
      <button type="button" class="webdav-btn webdav-btn-primary" id="webdav-connect">连接</button>
    </div>
    
    <!-- 认证步骤 -->
    <div class="webdav-step" id="webdav-step-auth" style="display:none">
      <div class="webdav-form-group">
        <label for="webdav-username">用户名</label>
        <input type="text" id="webdav-username" placeholder="用户名" autocomplete="username">
      </div>
      <div class="webdav-form-group">
        <label for="webdav-password">密码</label>
        <input type="password" id="webdav-password" placeholder="密码" autocomplete="current-password">
      </div>
      <div class="webdav-checkbox">
        <input type="checkbox" id="webdav-remember">
        <label for="webdav-remember">记住账号密码</label>
      </div>
      <div class="webdav-actions">
        <button type="button" class="webdav-btn webdav-btn-secondary" id="webdav-auth-back">返回</button>
        <button type="button" class="webdav-btn webdav-btn-primary" id="webdav-login">登录</button>
      </div>
    </div>
    
    <!-- 文件浏览步骤 -->
    <div class="webdav-step" id="webdav-step-browse" style="display:none">
      <div class="webdav-breadcrumb" id="webdav-breadcrumb"></div>
      <div class="webdav-file-list" id="webdav-file-list">
        <div class="webdav-loading">加载中...</div>
      </div>
      <div class="webdav-actions">
        <button type="button" class="webdav-btn webdav-btn-secondary" id="webdav-refresh">刷新</button>
