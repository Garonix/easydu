<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>简读</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== Bookshelf ===== -->
<div id="bookshelf">
  <header class="bs-header">
    <div class="bs-header-left">
      <button class="bs-import-btn" id="bs-import" title="导入书籍">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
    </div>
    <div class="bs-title">静读<span class="bs-subtitle"> · 书架</span></div>
    <div class="bs-header-right">
      <button class="bs-icon-btn" id="bs-theme-btn" title="切换主题">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </header>
  <main class="bs-main" id="bs-main">
    <div class="bs-grid" id="bs-grid"></div>
    <div class="bs-empty" id="bs-empty">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".25"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="9" y1="7" x2="16" y2="7"/><line x1="9" y1="11" x2="14" y2="11"/></svg>
      <p>书架空空如也</p>
      <p class="bs-empty-hint">点击左上角导入或拖拽文件到此处</p>
    </div>
  </main>
</div>

<!-- ===== Loading ===== -->
<div id="loading"><div class="spinner"></div><p id="loading-text">正在解析文件...</p></div>

<!-- ===== Reader ===== -->
<div id="reader">
  <header id="toolbar">
    <button class="tb-btn" id="btn-toc" title="目录"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <div class="tb-title" id="tb-title">—</div>
    <button class="tb-btn" id="btn-home" title="返回书架"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></button>
    <button class="tb-btn" id="btn-search" title="搜索"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
    <button class="tb-btn" id="btn-bm" title="书签"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
    <button class="tb-btn" id="btn-theme" title="主题"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
    <button class="tb-btn" id="btn-settings" title="设置"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>

  <div id="search-bar"><div class="search-row">
    <input type="text" id="search-input" placeholder="搜索全文内容...">
    <span id="search-count"></span>
    <button class="sr-btn" id="s-prev" title="上一个"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg></button>
    <button class="sr-btn" id="s-next" title="下一个"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
    <button class="sr-btn" id="s-close" title="关闭"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div></div>

  <div id="sidebar-overlay"></div>
  <aside id="sidebar">
    <div class="sidebar-head"><b id="sidebar-title">—</b><span id="sidebar-info">—</span></div>
    <div class="sidebar-tabs"><button class="stab active" data-tab="toc">目录</button><button class="stab" data-tab="bm">书签</button></div>
    <div id="toc-panel" class="stab-panel active"><div id="toc-list"></div></div>
    <div id="bm-panel" class="stab-panel"><div id="bm-list"></div></div>
  </aside>

  <div id="settings-overlay"></div>
  <aside id="settings">
    <div class="settings-title">阅读设置</div>
    <div class="settings-group"><div class="settings-label">字号 <span id="val-fs">18px</span></div><input type="range" id="range-fs" min="14" max="28" value="18" step="1"></div>
    <div class="settings-group"><div class="settings-label">行高 <span id="val-lh">1.85</span></div><input type="range" id="range-lh" min="1.4" max="2.6" value="1.85" step="0.05"></div>
    <div class="settings-group"><div class="settings-label">主题</div><div class="theme-toggle"><button data-t="light" class="active">日间</button><button data-t="dark">夜间</button></div></div>
    <div class="settings-group"><div class="settings-label">边距</div><div class="settings-row"><button data-pad="narrow">窄</button><button data-pad="normal" class="active">标准</button><button data-pad="wide">宽</button></div></div>
    <div class="settings-group stats-group">
      <div class="settings-label">阅读统计</div>
      <div class="stats-row"><span>总阅读</span><span id="stats-total">0 分钟</span></div>
      <div class="stats-row"><span>今日</span><span id="stats-today">0 分钟</span></div>
      <div class="stats-row"><span>本书</span><span id="stats-book">0 分钟</span></div>
    </div>
  </aside>

  <main id="content"><div id="content-inner"></div></main>
  <div id="progress-track"><div id="progress-bar"><div id="progress-fill"></div><div id="progress-thumb"></div></div><div id="progress-tip">0%</div></div>
</div>
<div id="toast"></div>
<input type="file" id="file-input" accept=".txt,.md,.markdown,.epub" hidden>

<script src="script.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
</body>
</html>
